# =====================================================================
#  ESP32-S3-RLCD-4.2 — Microphone Wake Word Test
#  Covers: ST7305 display / ES7210 dual-mic / micro_wake_word
#  Note:   Say "Hey Jarvis" — the on-screen counter increments each
#          time the wake word is detected.  Runs entirely on-device,
#          no Home Assistant voice pipeline required.
# =====================================================================

esphome:
  name: esp32-s3-rlcd-42
  friendly_name: ESP32-S3-RLCD-4.2

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    components:
      - espressif/esp-nn==1.1.2

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD
    components: [st7305_rlcd]

logger:

api:
  encryption:
    key: "REPLACE_WITH_YOUR_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp32-S3-Rlcd-42"
    password: "REPLACE_WITH_YOUR_PASSWORD"

captive_portal:

# ---------- Buses ----------
spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

i2c:
  sda: GPIO13
  scl: GPIO14
  scan: true
  id: bus_a

i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

# ---------- Audio ADC + Microphone ----------
audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_shared
    i2s_din_pin: GPIO10
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    pdm: false

# ---------- Wake word detection ----------
globals:
  - id: wake_count
    type: int
    restore_value: false
    initial_value: "0"

micro_wake_word:
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 4
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - lambda: 'id(wake_count) += 1;'
    - component.update: my_display

# ---------- Fonts ----------
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 22
  - file: "gfonts://Roboto@700"
    id: font_value
    size: 64

# ---------- Display ----------
display:
  - platform: st7305_rlcd
    model: WAVESHARE_400X300
    id: my_display
    width: 400
    height: 300
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    data_rate: 1MHz
    update_interval: 60s
    lambda: |-
      it.print(200, 40, id(font_title), TextAlign::TOP_CENTER, "Say \"Hey Jarvis\"");
      it.print(200, 130, id(font_title), TextAlign::TOP_CENTER, "Wake count");
      it.printf(200, 165, id(font_value), TextAlign::TOP_CENTER, "%d", id(wake_count));
