# =====================================================================
#  ESP32-S3-RLCD-4.2 — Sensor Dashboard + Speaker RTTTL Test
#  Covers: ST7305 display / SHTC3 / battery / buttons / ES8311 speaker
#  Note:   Press "Play Tune" in HA to verify speaker & amplifier.
# =====================================================================

esphome:
  name: esp32-s3-rlcd-42
  friendly_name: ESP32-S3-RLCD-4.2

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD
    components: [st7305_rlcd]

logger:

api:
  encryption:
    key: "REPLACE_WITH_YOUR_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_YOUR_PASSWORD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp32-S3-Rlcd-42"
    password: "REPLACE_WITH_YOUR_PASSWORD"

captive_portal:

# ---------- Buses ----------
i2c:
  sda: GPIO13
  scl: GPIO14
  scan: true
  id: bus_a

spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

# ---------- Audio DAC + Speaker ----------
audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_shared
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit

# ---------- RTTTL buzzer ----------
rtttl:
  speaker: spk
  gain: 80%

button:
  - platform: template
    name: "Play Tune"
    on_press:
      - rtttl.play: "NokiaTune:d=4,o=5,b=225:8e6,8d6,4f#,4g#,8c#6,8b,4d,4e,8b,8a,4c#,4e,2a"

# ---------- Fonts ----------
font:
  - file: "gfonts://Roboto"
    id: font_label
    size: 18
  - file: "gfonts://Roboto@700"
    id: font_value
    size: 48
  - file: "gfonts://Roboto"
    id: font_title
    size: 22

# ---------- Display ----------
display:
  - platform: st7305_rlcd
    model: WAVESHARE_400X300
    id: my_display
    width: 400
    height: 300
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    data_rate: 1MHz
    update_interval: 30s
    lambda: |-
      // Title bar (inverted)
      it.filled_rectangle(0, 0, 400, 40);
      it.print(200, 20, id(font_title), COLOR_OFF, TextAlign::CENTER, "ESP32-S3-RLCD-4.2");

      // Temperature (left)
      it.print(20, 52, id(font_label), "TEMP");
      it.printf(20, 72, id(font_value), "%.1f", id(temp_sensor).state);
      it.print(160, 92, id(font_label), "C");

      // Humidity (right)
      it.print(210, 52, id(font_label), "HUMIDITY");
      it.printf(210, 72, id(font_value), "%.0f", id(hum_sensor).state);
      it.print(330, 92, id(font_label), "%");

      // Separator
      it.line(0, 150, 400, 150);

      // Battery voltage & level
      it.print(20, 162, id(font_label), "BATTERY");
      it.printf(380, 162, id(font_label), TextAlign::TOP_RIGHT,
                "%.2f V  (%.0f%%)", id(bat_voltage).state, id(bat_level).state);

      // Battery progress bar
      int bx = 20, by = 192, bw = 360, bh = 30;
      it.rectangle(bx, by, bw, bh);
      int fill = (int)((bw - 4) * id(bat_level).state / 100.0);
      if (fill > 0) it.filled_rectangle(bx + 2, by + 2, fill, bh - 4);

# ---------- Sensors ----------
sensor:
  - platform: shtcx
    address: 0x70
    update_interval: 60s
    i2c_id: bus_a
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor

  - platform: adc
    id: bat_voltage
    name: "Battery Voltage"
    pin: GPIO4
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 3.0

  - platform: copy
    source_id: bat_voltage
    id: bat_level
    name: "Battery Level"
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 2.5 -> 0.0
          - 4.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

# ---------- Switches ----------
# Amplifier enable — must be ON for speaker output
switch:
  - platform: gpio
    name: "Speaker Enable"
    pin: GPIO46
    restore_mode: RESTORE_DEFAULT_ON

# ---------- Buttons ----------
binary_sensor:
  - platform: gpio
    name: "Boot Button"
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT

  - platform: gpio
    name: "Key Button"
    pin:
      number: GPIO18
      inverted: true
      mode: INPUT
